[Mod]
Version = 1
Id = auto-trail-lights
Release = 1.1.3
Name = Auto Trail Lights
Description = Light a whole trail for night skiing in one click: the game's own Tower Lights go along both edges, evenly spaced so the whole run is lit, as Uniform pairs or a Jagged zipper, with preset or custom colors and a rainbow Party mode. Switch styles or remove them later for a refund.
Usage = Click a trail and open its Edit tab. In the Trail lights section pick Uniform or Jagged, then click Install trail lights. Light color and Party appear once the trail has lights.
